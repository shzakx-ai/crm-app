<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Login</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--border:#475569;--text:#f1f5f9;--muted:#94a3b8;--accent:#3b82f6;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;width:100%;max-width:380px}
.login-card h1{font-size:22px;margin-bottom:24px;text-align:center}
.login-card form{display:flex;flex-direction:column;gap:14px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form-group input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.form-group input:focus{outline:none;border-color:var(--accent)}
.btn{display:block;width:100%;padding:10px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:#2563eb}
.error{background:#ef444420;color:#f87171;border:1px solid #ef4444;border-radius:8px;padding:10px;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="login-card">
  <h1>🔐 CRM Login</h1>
  {% if error %}
  <div class="error" style="margin-bottom:14px">Invalid username or password</div>
  {% endif %}
  <form method="post" action="/login">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
</div>
</body>
</html>
